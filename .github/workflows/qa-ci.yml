name: PandAI QA - Continuous Integration

on:
  push:
    branches: [main, integration/pandai, "feature/**"]
  pull_request:
    branches: [main, integration/pandai]

jobs:
  qa-ml-service-test:
    name: Test ML FastAPI & Latency (< 100ms)
    runs-on: ubuntu-26.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v7

      - name: 2. Set up Python 3.15.2
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"
          cache: "pip"
          cache-dependency-path: "ml-service/requirements.txt"

      - name: 3. Audit Forbidden AutoML Libraries
        working-directory: ./ml-service
        run: |
          if grep -iE "pycaret|auto-sklearn|autosklearn|lazypredict|tpot|flaml" requirements.txt; then
            echo "ERROR: Pustaka AutoML terdeteksi di requirements.txt!"
            exit 1
          fi

      - name: 4. Install Dependencies & Run Pytest
        working-directory: ./ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov
          pytest -v --cov=. --cov-report=term-missing

  qa-backend-test:
    name: Test Backend NestJS 12 (Vitest & Oxlint)
    runs-on: ubuntu-26.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v7

      - name: 2. Set up Node.js 26 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: "apps/api/package-lock.json"

      - name: 3. Execute Oxlint, Unit Tests & E2E Tests
        working-directory: ./apps/api
        run: |
          npm ci
          npm run lint
          npm run test:cov
          npm run test:e2e